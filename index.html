<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Loading</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#0b0d12;--panel:#12161f;--line:#1e2533;--txt:#e6e9f0;--dim:#8b93a7;--acc:#ff3d5a;--acc2:#ffa53d;--ok:#2ee6a8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{min-height:100vh;background:radial-gradient(900px 420px at 50% -10%,rgba(255,61,90,.16),transparent 65%),
    radial-gradient(700px 380px at 90% 10%,rgba(255,165,61,.10),transparent 60%),var(--bg)}
  .wrap{max-width:780px;margin:0 auto;padding:34px 18px 70px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .logo{width:52px;height:52px;border-radius:14px;flex:0 0 auto;background:linear-gradient(145deg,var(--acc),#8e0e24);
    display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-1px;
    box-shadow:0 10px 28px rgba(255,61,90,.28)}
  h1{font-size:22px;margin:0}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
  .ver{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .tag{font-size:11.5px;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tag.live{color:var(--ok);border-color:rgba(46,230,168,.35);background:rgba(46,230,168,.07)}
  .meta{color:var(--dim);font-size:12.5px;margin-top:6px;word-break:break-all}
  .notice{border-left:3px solid var(--acc2);padding:9px 12px;margin:14px 0 0;background:rgba(255,165,61,.06);
    border-radius:0 10px 10px 0;font-size:13.5px;color:#f0dcc2}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:7px 15px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);
    font-size:13px;cursor:pointer;font-family:inherit}
  .tab.on{color:#fff;border-color:rgba(255,61,90,.55);background:rgba(255,61,90,.14)}
  .dl{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:560px){.dl{grid-template-columns:1fr 1fr}}
  a.btn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:13px;
    text-decoration:none;color:var(--txt);border:1px solid var(--line);background:rgba(255,255,255,.025);
    transition:.16s transform,.16s border-color,.16s background}
  a.btn:hover{transform:translateY(-1px);border-color:rgba(255,61,90,.5);background:rgba(255,61,90,.07)}
  a.btn .n{font-size:11px;color:var(--dim);display:block;letter-spacing:.6px}
  a.btn .t{font-size:14.5px;font-weight:600}
  a.btn .ar{color:var(--acc);font-size:18px}
  a.btn.primary{background:linear-gradient(140deg,var(--acc),#b31032);border-color:transparent;
    box-shadow:0 12px 30px rgba(255,61,90,.22)}
  a.btn.primary .n{color:rgba(255,255,255,.72)}
  a.btn.primary .ar{color:#fff}
  h2{font-size:12.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin:0 0 12px;font-weight:700}
  ul.log{margin:0;padding-left:18px;font-size:13.5px;color:#c7cdda}
  ul.log li{margin:4px 0}
  code.h{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0a0c11;border:1px solid var(--line);
    padding:9px 11px;border-radius:9px;display:block;overflow:auto;color:#9fb0c9;white-space:nowrap}
  .cp{position:relative}
  .cp button{position:absolute;right:8px;top:8px;font-size:11px;padding:4px 9px;border-radius:7px;background:#1a2030;
    color:var(--dim);border:1px solid var(--line);cursor:pointer;font-family:inherit}
  footer{color:#5b6377;font-size:11.5px;text-align:center;margin-top:32px;line-height:1.9}
  .err{color:#ff7b8f;font-size:13px}
  .skel{height:44px;border-radius:13px;background:linear-gradient(90deg,#161b26,#1e2533,#161b26);
    background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
<script src="payload.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">&nbsp;</div>
    <div>
      <h1 id="h1">&nbsp;</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <span class="ver" id="ver">--</span>
      <span class="tag live" id="chan">stable</span>
      <span class="tag" id="bt">build --</span>
    </div>
    <div class="meta" id="meta">读取中…</div>
    <div class="notice" id="notice" style="display:none"></div>
  </div>

  <div class="card">
    <h2 id="dlh">DOWNLOAD</h2>
    <div class="tabs" id="tabs"></div>
    <div class="dl" id="dl"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <div class="card">
    <h2 id="ckh">SHA-256</h2>
    <div class="meta" style="margin:0 0 8px" id="ckt">--</div>
    <div class="cp"><code class="h" id="sha">--</code><button id="cpy">复制</button></div>
  </div>

  <div class="card">
    <h2 id="logh">CHANGELOG</h2>
    <ul class="log" id="log"><li>读取中…</li></ul>
  </div>

  <footer><span id="foot">--</span></footer>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // ---------- 关键词在运行时才还原 ----------
  function boot(){
    var b0 = KW('brand',0);            // 品牌
    document.title = b0;
    $('logo').textContent = b0.charAt(0);
    $('h1').textContent   = b0;
    $('sub').textContent  = KW('desc',0) + ' · ' + KW('slogan',0) + ' · ' + KW('slogan',2);
    $('dlh').textContent  = '下载线路';
    $('ckh').textContent  = '完整性校验';
    $('logh').textContent = '更新日志';
    $('ckt').textContent  = '下载后核对 SHA-256，不一致就别装。';
  }

  // ---------- 平台判定 ----------
  function detectPlatform(){
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua)) return 'android';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
    if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';
    if (/Windows|Win64|WOW64/i.test(ua)) return 'win';
    return 'all';
  }

  var PLAT_LABEL = { win:'Windows', android:'Android', ios:'iOS', mac:'macOS', all:'全部' };

  function buildTabs(list, cur){
    var tabs = $('tabs'); tabs.innerHTML = '';
    var order = ['win','android','ios','mac','all'];
    order.forEach(function(p){
      if (!list.some(function(m){ return (m.platform||'all') === p; })) return;
      var b = document.createElement('button');
      b.className = 'tab' + (p === cur ? ' on' : '');
      b.textContent = PLAT_LABEL[p];
      b.onclick = function(){ renderMirrors(list, p); };
      tabs.appendChild(b);
    });
  }

  function renderMirrors(list, plat){
    buildTabs(list, plat);
    var dl = $('dl'); dl.innerHTML = '';
    var rows = list.filter(function(m){ return (m.platform||'all') === plat; });
    if (!rows.length) rows = list;
    rows.forEach(function(m, i){
      var a = document.createElement('a');
      a.className = 'btn' + (i === 0 ? ' primary' : '');
      a.href = m.url; a.rel = 'noopener noreferrer nofollow';
      a.innerHTML = '<span><span class="n">' + esc(m.label || ('线路 ' + (i+1))) +
        '</span><span class="t">' + esc(m.hint || '点击下载') + '</span></span><span class="ar">↓</span>';
      dl.appendChild(a);
    });
    if (!dl.children.length) dl.innerHTML = '<div class="err">当前平台暂无线路，切到“全部”看看。</div>';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(v){
    // 整站直跳：version.json 里写 "redirect":"https://目标/" 就即时跳转
    if (v.redirect && typeof v.redirect === 'string' && v.redirect.length > 4
        && new URLSearchParams(location.search).get('stay') === null){
      location.replace(v.redirect);
      return;
    }
    $('ver').textContent = 'v' + (v.version || '0.0.0');
    $('chan').textContent = v.channel || 'stable';
    $('bt').textContent = 'build ' + (v.build || '--');
    var meta = [];
    if (v.size) meta.push('大小 ' + (v.size / 1048576).toFixed(1) + ' MB');
    if (v.updated) meta.push('更新于 ' + esc(v.updated));
    meta.push(KW('slogan',1) + '包');
    $('meta').innerHTML = meta.join(' · ');
    if (v.notice){
      var n = $('notice'); n.textContent = v.notice; n.style.display = 'block';
    }
    renderMirrors(v.mirrors || [], detectPlatform());
    $('sha').textContent = v.sha256 || '--';
    var log = $('log'); log.innerHTML = '';
    var notes = (v.notes && v.notes.length) ? v.notes
      : [KW('notes',0), KW('notes',1), KW('notes',2)];
    notes.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; log.appendChild(li); });
    $('foot').innerHTML = esc(KW('desc',0)) + ' · ' + esc(KW('desc',1)) + ' · ' + esc(KW('desc',2)) +
      '<br><span style="opacity:.65">更新：' + esc(v.updated || '--') + '</span>';
  }

  function fail(msg){
    $('meta').innerHTML = '<span class="err">' + esc(msg) + '</span>';
    $('dl').innerHTML = '<div class="err">版本数据没拉到，刷新或换网络再试。</div>';
  }

  boot();

  fetch('version.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function(e){ fail('读取失败：' + e.message); });

  $('cpy').onclick = function(){
    navigator.clipboard.writeText($('sha').textContent).then(function(){
      var b = $('cpy'); b.textContent = '已复制';
      setTimeout(function(){ b.textContent = '复制'; }, 1400);
    });
  };

  // ?m=N 直接跳线路
  var m = new URLSearchParams(location.search).get('m');
  if (m !== null){
    fetch('version.json?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var i = Math.max(0, (parseInt(m, 10) || 1) - 1);
        var t = (v.mirrors || [])[i];
        if (t && t.url) location.replace(t.url);
      }).catch(function(){});
  }
})();
</script>
</body>
</html>
