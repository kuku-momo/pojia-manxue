<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Loading</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0a0b10; --panel:#111520; --line:#1d2433; --txt:#e8ebf3; --dim:#8b93a7;
    --acc:#ff3d5a; --acc2:#ffa53d; --ok:#2ee6a8; --blue:#4f8bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{background:
    radial-gradient(1000px 480px at 50% -12%,rgba(255,61,90,.20),transparent 62%),
    radial-gradient(820px 420px at 88% 6%,rgba(79,139,255,.13),transparent 60%),
    radial-gradient(700px 380px at 8% 22%,rgba(255,165,61,.10),transparent 60%),var(--bg)}
  .wrap{max-width:960px;margin:0 auto;padding:26px 18px 72px}
  nav{display:flex;align-items:center;gap:12px;margin-bottom:44px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--acc),#8e0e24);
    display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-1px;
    box-shadow:0 10px 26px rgba(255,61,90,.30)}
  .brand{font-weight:700;font-size:16px;letter-spacing:.4px}
  .brand small{display:block;color:var(--dim);font-weight:400;font-size:11.5px;letter-spacing:.2px}
  nav .sp{flex:1}
  a.ghost{padding:8px 15px;border-radius:10px;border:1px solid var(--line);color:var(--dim);
    text-decoration:none;font-size:13px}
  a.ghost:hover{color:var(--txt);border-color:#2b3852}

  h1{font-size:clamp(28px,5.2vw,46px);line-height:1.18;margin:0 0 16px;letter-spacing:-1px;font-weight:800}
  h1 .hl{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .lead{color:#b6bdcd;font-size:clamp(14px,2.1vw,17px);max-width:640px;margin:0 0 28px}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:54px}
  a.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:13px;
    text-decoration:none;font-weight:700;font-size:15px;transition:.16s transform,.16s box-shadow}
  a.btn:active{transform:scale(.98)}
  a.btn.p{background:linear-gradient(140deg,var(--acc),#b31032);color:#fff;
    box-shadow:0 14px 34px rgba(255,61,90,.30)}
  a.btn.s{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line)}
  a.btn.s:hover{border-color:#2f3d59}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:56px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
  .stat span{color:var(--dim);font-size:11.5px;letter-spacing:.3px}

  h2{font-size:13px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;
    margin:0 0 18px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:56px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  .feat{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
    transition:.18s border-color,.18s transform}
  .feat:hover{border-color:rgba(255,61,90,.42);transform:translateY(-2px)}
  .feat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:rgba(255,61,90,.13);color:var(--acc);font-size:15px;margin-bottom:12px;font-weight:700}
  .feat h3{margin:0 0 6px;font-size:15.5px;letter-spacing:.2px}
  .feat p{margin:0;color:var(--dim);font-size:13px;line-height:1.65}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:56px}
  .chip{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    font-size:12.5px;color:#c3cada}
  .chip i{color:var(--ok);font-style:normal;margin-right:5px}

  .steps{counter-reset:s;margin-bottom:56px}
  .step{position:relative;padding:0 0 22px 46px;border-left:1px solid var(--line);margin-left:14px}
  .step:last-child{border-left-color:transparent;padding-bottom:0}
  .step::before{counter-increment:s;content:counter(s);position:absolute;left:-15px;top:-2px;
    width:29px;height:29px;border-radius:50%;background:#151a26;border:1px solid var(--line);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--acc)}
  .step h3{margin:0 0 4px;font-size:14.5px}
  .step p{margin:0;color:var(--dim);font-size:13px}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;
    background:#0a0c12;border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:#9fb4d6}
  pre{margin:10px 0 0;background:#0a0c12;border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;overflow:auto}
  pre code{background:none;border:0;padding:0;color:#9fb4d6;line-height:1.75}

  .final{border:1px solid rgba(255,61,90,.32);border-radius:20px;padding:30px 24px;text-align:center;
    background:radial-gradient(600px 220px at 50% 0,rgba(255,61,90,.14),transparent 70%),
      linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008))}
  .final h2{color:var(--txt);font-size:21px;letter-spacing:-.4px;text-transform:none;margin-bottom:8px}
  .final p{color:var(--dim);font-size:13.5px;margin:0 0 20px}
  footer{color:#5b6377;font-size:11.5px;text-align:center;margin-top:40px;line-height:1.9}
</style>
<script src="payload.js"></script>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo" id="logo">&nbsp;</div>
    <div class="brand"><span id="brand">&nbsp;</span><small id="brandSub">&nbsp;</small></div>
    <div class="sp"></div>
    <a class="ghost" id="navCta" href="#">进入站点</a>
  </nav>

  <h1 id="h1">&nbsp;</h1>
  <p class="lead" id="lead">&nbsp;</p>
  <div class="cta">
    <a class="btn p" id="ctaMain" href="#">&nbsp;</a>
    <a class="btn s" id="ctaAlt" href="#">&nbsp;</a>
  </div>

  <div class="stats" id="stats"></div>

  <h2>为什么用它</h2>
  <div class="grid" id="feats"></div>

  <h2>支持模型</h2>
  <div class="chips" id="models"></div>

  <h2>接入只要三步</h2>
  <div class="steps" id="steps"></div>

  <div class="final">
    <h2 id="finalTitle">&nbsp;</h2>
    <p id="finalDesc">&nbsp;</p>
    <a class="btn p" id="finalCta" href="#">&nbsp;</a>
  </div>

  <footer><span id="foot">&nbsp;</span></footer>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var CFG = null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function bootChrome(){
    var b = KW('brand',0);
    document.title = (CFG && CFG.site && CFG.site.title) ? CFG.site.title : b;
    $('logo').textContent = b.charAt(0);
    $('brand').textContent = b;
    $('brandSub').textContent = KW('slogan',0) + ' · ' + KW('slogan',2);
  }

  function applySite(){
    var s = (CFG && CFG.site) || {};
    if (s.headline){ $('h1').innerHTML = esc(s.headline).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>'); }
    if (s.lead) $('lead').textContent = s.lead;

    var cta = s.cta || {};
    $('navCta').textContent = cta.nav || '进入站点';
    $('navCta').href = cta.url || '#';
    $('ctaMain').textContent = cta.main || '立即进入';
    $('ctaMain').href = cta.url || '#';
    if (cta.alt){ $('ctaAlt').textContent = cta.alt; $('ctaAlt').href = cta.altUrl || cta.url || '#'; }
    else { $('ctaAlt').style.display = 'none'; }

    var st = $('stats'); st.innerHTML = '';
    (s.stats || []).forEach(function(x){
      var d = document.createElement('div'); d.className = 'stat';
      d.innerHTML = '<b>' + esc(x.value) + '</b><span>' + esc(x.label) + '</span>';
      st.appendChild(d);
    });
    if (!st.children.length) st.style.display = 'none';

    var f = $('feats'); f.innerHTML = '';
    (s.features || []).forEach(function(x, i){
      var d = document.createElement('div'); d.className = 'feat';
      d.innerHTML = '<div class="ic">' + esc(x.icon || String(i+1)) + '</div>' +
        '<h3>' + esc(x.title) + '</h3><p>' + esc(x.desc) + '</p>';
      f.appendChild(d);
    });

    var m = $('models'); m.innerHTML = '';
    (s.models || []).forEach(function(x){
      var d = document.createElement('span'); d.className = 'chip';
      d.innerHTML = '<i>✓</i>' + esc(x);
      m.appendChild(d);
    });
    if (!m.children.length) m.parentNode.style.display = 'none';

    var sp = $('steps'); sp.innerHTML = '';
    (s.steps || []).forEach(function(x){
      var d = document.createElement('div'); d.className = 'step';
      d.innerHTML = '<h3>' + esc(x.title) + '</h3><p>' + esc(x.desc) + '</p>' +
        (x.code ? '<pre><code>' + esc(x.code) + '</code></pre>' : '');
      sp.appendChild(d);
    });
    if (!sp.children.length) sp.parentNode.style.display = 'none';

    $('finalTitle').textContent = s.finalTitle || '现在就开始';
    $('finalDesc').textContent = s.finalDesc || '';
    $('finalCta').textContent = cta.main || '立即进入';
    $('finalCta').href = cta.url || '#';
    $('foot').innerHTML = esc(KW('desc',0)) + ' · ' + esc(KW('desc',1)) +
      '<br><span style="opacity:.6">更新：' + esc(s.updated || (CFG && CFG.updated) || '--') + '</span>';
  }

  fetch('version.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(v){
      CFG = v || {};
      bootChrome();
      applySite();
      // redirect 只在显式配置且没有 ?stay 时生效
      if (CFG.redirect && CFG.redirect.length > 4 &&
          new URLSearchParams(location.search).get('stay') === null){
        location.replace(CFG.redirect);
      }
    })
    .catch(function(e){
      bootChrome();
      $('h1').textContent = KW('brand',0);
      $('lead').textContent = '内容加载失败：' + e.message;
    });
})();
</script>
</body>
</html>
